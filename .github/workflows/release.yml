name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Linux: build Flutter bundle → package tar.gz (for in-app update)
  #        + makeself .bin installer (for first install)
  # ---------------------------------------------------------------------------
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev makeself \
            libayatana-appindicator3-dev

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Dependencies
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release

      # ---- Archive (.tar.gz) — used by in-app GUI auto-update ---------------
      - name: Package tar.gz (in-app update)
        run: |
          cd build/linux/x64/release/bundle
          tar -czf "${{ github.workspace }}/pp-gui-${{ github.ref_name }}-linux.tar.gz" .

      # ---- makeself .bin installer ------------------------------------------
      - name: Build .bin installer (makeself)
        run: |
          # Copy installer script into the bundle so makeself includes it
          cp installer/linux/install.sh build/linux/x64/release/bundle/install.sh
          chmod +x build/linux/x64/release/bundle/install.sh

          makeself \
            --needroot \
            build/linux/x64/release/bundle \
            "pp-gui-${{ github.ref_name }}-linux.bin" \
            "PP GUI ${{ github.ref_name }} Installer" \
            ./install.sh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            pp-gui-${{ github.ref_name }}-linux.tar.gz
            pp-gui-${{ github.ref_name }}-linux.bin

  # ---------------------------------------------------------------------------
  # Windows: build Flutter bundle → package zip (for in-app update)
  #          + Inno Setup .exe installer (for first install)
  # ---------------------------------------------------------------------------
  build-windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      # ---- Archive (.zip) — used by in-app GUI auto-update ------------------
      - name: Package zip (in-app update)
        shell: pwsh
        run: |
          Compress-Archive `
            -Path build\windows\x64\runner\Release\* `
            -DestinationPath "pp-gui-${{ github.ref_name }}-windows.zip"

      # ---- Inno Setup .exe installer ----------------------------------------
      - name: Prepare Inno Setup bundle directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer\windows\bundle | Out-Null
          Copy-Item -Recurse -Force build\windows\x64\runner\Release\* installer\windows\bundle\

      - name: Build .exe installer (Inno Setup)
        shell: pwsh
        run: |
          # Inno Setup is pre-installed on windows-latest runners
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc `
            /DAppVersion="${{ github.ref_name }}" `
            /O"." `
            /F"pp-gui-${{ github.ref_name }}-windows-setup" `
            installer\windows\pp-gui.iss

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            pp-gui-${{ github.ref_name }}-windows.zip
            pp-gui-${{ github.ref_name }}-windows-setup.exe

  # ---------------------------------------------------------------------------
  # Create GitHub release and attach all artefacts
  # ---------------------------------------------------------------------------
  release:
    name: Create Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/download-artifact@v4
        with:
          name: linux-build
          path: artifacts

      - uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: artifacts

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_SHA=$(gh api repos/${{ github.repository }}/git/ref/tags/${{ github.ref_name }} --jq '.object.sha')
          MSG=$(gh api repos/${{ github.repository }}/git/tags/$TAG_SHA --jq '.message' 2>/dev/null || echo "")
          if [ -z "$MSG" ] || [ "$MSG" = "null" ]; then
            MSG=$(git log -1 --format=%B)
          fi
          echo "$MSG" > release_notes.txt

          gh release create ${{ github.ref_name }} \
            --title "PP GUI ${{ github.ref_name }}" \
            --notes-file release_notes.txt \
            "artifacts/pp-gui-${{ github.ref_name }}-linux.bin#Linux Installer (.bin)" \
            "artifacts/pp-gui-${{ github.ref_name }}-linux.tar.gz#Linux Archive (in-app update)" \
            "artifacts/pp-gui-${{ github.ref_name }}-windows-setup.exe#Windows Installer (.exe)" \
            "artifacts/pp-gui-${{ github.ref_name }}-windows.zip#Windows Archive (in-app update)"
